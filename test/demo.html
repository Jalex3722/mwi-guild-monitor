<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MWI Guild Monitor UI Test</title>
    <style>
        body { margin: 0; min-height: 100vh; background: #111827; color: #d8e0ec; font: 14px/1.5 system-ui, sans-serif; }
        .game-shell { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
        aside { padding: 22px; background: #0c1422; border-right: 1px solid #27364e; }
        main { padding: 28px; }
        h1 { margin: 0 0 18px; font-size: 22px; }
        .game-row { max-width: 720px; padding: 12px 0; border-bottom: 1px solid #27364e; }
    </style>
    <script>
        localStorage.clear();
        window.WebSocket = class MockWebSocket extends EventTarget {
            constructor(url) {
                super();
                this.url = url;
            }
        };
        window.fetch = async () => ({
            ok: true,
            status: 200,
            json: async () => ({
                timestamp: Math.floor(Date.now() / 1000),
                marketData: {
                    "/items/apple": { 0: { a: 28, b: 27, p: 27.5 } },
                    "/items/arcane_log": { 0: { a: 310, b: 300, p: 305 } },
                    "/items/amethyst": { 0: { a: 36000, b: 35000, p: 35500 } },
                },
            }),
        });
    </script>
    <script src="../mwi-guild-monitor.user.js"></script>
</head>
<body>
    <div class="game-shell">
        <aside>Milky Way Idle<br><br>Guild<br>Marketplace<br>Skills</aside>
        <main>
            <h1>Guild Members</h1>
            <div class="game-row">Ada · Leader · Online</div>
            <div class="game-row">Babbage · Officer</div>
            <div class="game-row">Curie · Member</div>
            <div class="game-row">Noether · Member</div>
        </main>
        <section class="GamePage_chatPanel" aria-label="Game chat">
            <textarea aria-label="Chat message" placeholder="Type a message..."></textarea>
        </section>
    </div>
    <script>
        const socket = new WebSocket("wss://api.milkywayidle.com/ws");
        socket.addEventListener("message", (event) => event.data);

        const send = (message) => socket.dispatchEvent(new MessageEvent("message", { data: JSON.stringify(message) }));
        const skills = (id, total, cooking, mining) => [
            { characterID: id, skillHrid: "/skills/total_level", level: total, experience: 0 },
            { characterID: id, skillHrid: "/skills/cooking", level: cooking, experience: 0 },
            { characterID: id, skillHrid: "/skills/mining", level: mining, experience: 0 },
        ];
        const now = Date.now();
        const todayUtc = new Date(now);
        const midnightUtc = Date.UTC(todayUtc.getUTCFullYear(), todayUtc.getUTCMonth(), todayUtc.getUTCDate());
        const currentWeekStartAt = midnightUtc - ((todayUtc.getUTCDay() - 5 + 7) % 7) * 86_400_000;
        const previousWeekStartAt = currentWeekStartAt - 7 * 86_400_000;
        const guildCharacterMap = {
            1: { characterID: 1, guildRole: "leader", experience: 120000000, weeklyExperience: 1200000, status: "joined", signedUpSkillingTrialHrid: "/guild_skilling/cooking", signedUpCombatTrialHrid: "/guild_combat/badger", signedUpCombatRoleHrid: "/combat_roles/tank", signupWeekStartAt: currentWeekStartAt },
            2: { characterID: 2, guildRole: "officer", experience: 98000000, weeklyExperience: 900000, status: "joined", signedUpSkillingTrialHrid: "/guild_skilling/cooking", signedUpCombatTrialHrid: "/guild_combat/badger", signedUpCombatRoleHrid: "/combat_roles/damage", signupWeekStartAt: currentWeekStartAt },
            3: { characterID: 3, guildRole: "member", experience: 72000000, weeklyExperience: 430000, status: "joined", signedUpSkillingTrialHrid: "/guild_skilling/mining", signedUpCombatTrialHrid: "", signupWeekStartAt: currentWeekStartAt },
            4: { characterID: 4, guildRole: "member", experience: 61000000, weeklyExperience: 240000, status: "joined", signedUpSkillingTrialHrid: "", signedUpCombatTrialHrid: "", signupWeekStartAt: currentWeekStartAt },
        };
        const guildSharableCharacterMap = {
            1: { id: 1, name: "Ada", isOnline: true },
            2: { id: 2, name: "Babbage", isOnline: false, lastOfflineTime: now - 4 * 86_400_000 },
            3: { id: 3, name: "Curie", isOnline: false, hideOnlineStatus: true, lastOfflineTime: now - 8 * 86_400_000 },
            4: { id: 4, name: "Noether", isOnline: false, lastOfflineTime: now - 6 * 86_400_000 },
        };

        window.addEventListener("load", () => {
            localStorage.setItem("mwi-guild-monitor:v1", JSON.stringify({
                version: 1,
                guilds: {
                    44: {
                        name: "The Milky Scholars",
                        profiles: {},
                        snapshots: [],
                        auraAssignments: {
                            1: { auraHrid: "/abilities/speed_aura", updatedAt: Date.now() },
                            2: { auraHrid: "/abilities/guardian_aura", updatedAt: Date.now() },
                            3: { auraHrid: "/abilities/speed_aura", updatedAt: Date.now() },
                            4: { auraHrid: "/abilities/mystic_aura", updatedAt: Date.now() },
                        },
                        trialHistory: {
                            [previousWeekStartAt]: {
                                weekStartAt: previousWeekStartAt,
                                observedAt: previousWeekStartAt + 6 * 86_400_000,
                                members: {
                                    1: { memberName: "Ada", signedSkilling: true, signedCombat: true },
                                    2: { memberName: "Babbage", signedSkilling: false, signedCombat: true },
                                    3: { memberName: "Curie", signedSkilling: false, signedCombat: false },
                                },
                            },
                        },
                    },
                },
            }));
            send({
                type: "init_client_data",
                skillDetailMap: {
                    "/skills/total_level": { name: "Total Level" },
                    "/skills/cooking": { name: "Cooking" },
                    "/skills/mining": { name: "Mining" },
                },
                guildTrialDetailMap: {
                    "/guild_skilling/cooking": { kind: "skilling", skillHrid: "/skills/cooking" },
                    "/guild_skilling/mining": { kind: "skilling", skillHrid: "/skills/mining" },
                    "/guild_combat/badger": { kind: "combat" },
                    "/guild_combat/swarm": { kind: "combat" },
                },
                itemDetailMap: {
                    "/items/apple": { name: "Apple", guildCreditConversions: [{ creditItemHrid: "/items/green_guild_credit", itemCount: 20, creditCount: 5 }] },
                    "/items/arcane_log": { name: "Arcane Log", guildCreditConversions: [{ creditItemHrid: "/items/green_guild_credit", itemCount: 1, creditCount: 4 }] },
                    "/items/amethyst": { name: "Amethyst", guildCreditConversions: [{ creditItemHrid: "/items/purple_guild_credit", itemCount: 2, creditCount: 1 }] },
                    "/items/green_guild_credit": { name: "Green Guild Credit" },
                    "/items/purple_guild_credit": { name: "Purple Guild Credit" },
                    "/items/guild_token": {
                        name: "Guild Token",
                        guildCreditConversions: [
                            { creditItemHrid: "/items/green_guild_credit", guildTokenCount: 1, creditCount: 10 },
                            { creditItemHrid: "/items/purple_guild_credit", guildTokenCount: 1, creditCount: 1 },
                        ],
                    },
                },
                guildBuffDetailMap: {
                    "/guild_buffs/force_combat": {
                        name: "Force Combat",
                        isCombat: true,
                        levelCosts: [null, { guildTokenCost: 2, creditCosts: [{ itemHrid: "/items/green_guild_credit", count: 30 }] }, { guildTokenCost: 3, creditCosts: [{ itemHrid: "/items/purple_guild_credit", count: 4 }] }],
                    },
                    "/guild_buffs/force_skilling": {
                        name: "Force Skilling",
                        isCombat: false,
                        levelCosts: [null, { guildTokenCost: 1, creditCosts: [{ itemHrid: "/items/green_guild_credit", count: 12 }] }],
                    },
                    "/guild_buffs/scholar_skilling": {
                        name: "Scholar Skilling",
                        isCombat: false,
                        levelCosts: [null, { guildTokenCost: 1, creditCosts: [{ itemHrid: "/items/green_guild_credit", count: 20 }] }],
                    },
                },
            });
            send({
                type: "init_character_data",
                guild: { id: 44, name: "The Milky Scholars", currentWeekStartAt, trialMinLevelsData: "{\"/guild_skilling/cooking\":90,\"/guild_skilling/mining\":90}" },
                guildCharacterMap,
                guildSharableCharacterMap,
                guildWeeklyTrialSet: { skillHrids: ["/guild_skilling/cooking", "/guild_skilling/mining"], combatHrids: ["/guild_combat/badger", "/guild_combat/swarm"] },
                guildTrialSignupLevelMap: {
                    1: { skillingTrialLevel: 104, combatLevel: 154 },
                    2: { skillingTrialLevel: 101, combatLevel: 149 },
                    3: { skillingTrialLevel: 98 },
                },
                character: { id: 1, name: "Ada" },
                characterSkills: skills(1, 1812, 154, 136),
                characterGuildBuffLevelMap: { "/guild_buffs/force_combat": 1, "/guild_buffs/force_skilling": 0, "/guild_buffs/scholar_skilling": 0 },
            });
            send({ type: "profile_shared", profile: { sharableCharacter: { id: 2, name: "Babbage" }, characterSkills: skills(2, 1691, 129, 151) } });
            send({ type: "profile_shared", profile: { sharableCharacter: { id: 3, name: "Curie" }, characterSkills: skills(3, 1744, 99, 138) } });
            setTimeout(() => document.getElementById("mwi-guild-monitor-button").click(), 50);
        });
    </script>
</body>
</html>
