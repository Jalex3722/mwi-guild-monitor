<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MWI Guild Monitor UI Test</title>
    <style>
        body { margin: 0; min-height: 100vh; background: #111827; color: #d8e0ec; font: 14px/1.5 system-ui, sans-serif; }
        .game-shell { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
        aside { padding: 22px; background: #0c1422; border-right: 1px solid #27364e; }
        main { padding: 28px; }
        h1 { margin: 0 0 18px; font-size: 22px; }
        .game-row { max-width: 720px; padding: 12px 0; border-bottom: 1px solid #27364e; }
    </style>
    <script>
        localStorage.clear();
        window.WebSocket = class MockWebSocket extends EventTarget {
            constructor(url) {
                super();
                this.url = url;
            }
        };
    </script>
    <script src="../mwi-guild-monitor.user.js"></script>
</head>
<body>
    <div class="game-shell">
        <aside>Milky Way Idle<br><br>Guild<br>Marketplace<br>Skills</aside>
        <main>
            <h1>Guild Members</h1>
            <div class="game-row">Ada · Leader · Online</div>
            <div class="game-row">Babbage · Officer</div>
            <div class="game-row">Curie · Member</div>
            <div class="game-row">Noether · Member</div>
        </main>
    </div>
    <script>
        const socket = new WebSocket("wss://api.milkywayidle.com/ws");
        socket.addEventListener("message", (event) => event.data);

        const send = (message) => socket.dispatchEvent(new MessageEvent("message", { data: JSON.stringify(message) }));
        const skills = (id, total, cooking, mining) => [
            { characterID: id, skillHrid: "/skills/total_level", level: total, experience: 0 },
            { characterID: id, skillHrid: "/skills/cooking", level: cooking, experience: 0 },
            { characterID: id, skillHrid: "/skills/mining", level: mining, experience: 0 },
        ];
        const guildCharacterMap = {
            1: { characterID: 1, guildRole: "leader", experience: 120000000, weeklyExperience: 1200000, status: "joined", signedUpSkillingTrialHrid: "/guild_skilling/cooking", signedUpCombatTrialHrid: "/guild_combat/badger", signedUpCombatRoleHrid: "/combat_roles/tank" },
            2: { characterID: 2, guildRole: "officer", experience: 98000000, weeklyExperience: 900000, status: "joined", signedUpSkillingTrialHrid: "/guild_skilling/mining", signedUpCombatTrialHrid: "/guild_combat/badger", signedUpCombatRoleHrid: "/combat_roles/damage" },
            3: { characterID: 3, guildRole: "member", experience: 72000000, weeklyExperience: 430000, status: "joined", signedUpSkillingTrialHrid: "/guild_skilling/mining", signedUpCombatTrialHrid: "" },
            4: { characterID: 4, guildRole: "member", experience: 61000000, weeklyExperience: 240000, status: "joined", signedUpSkillingTrialHrid: "", signedUpCombatTrialHrid: "" },
        };
        const guildSharableCharacterMap = {
            1: { id: 1, name: "Ada", isOnline: true },
            2: { id: 2, name: "Babbage", isOnline: false },
            3: { id: 3, name: "Curie", isOnline: true },
            4: { id: 4, name: "Noether", isOnline: false },
        };

        window.addEventListener("load", () => {
            localStorage.setItem("mwi-guild-monitor:v1", JSON.stringify({
                version: 1,
                guilds: {
                    44: {
                        name: "The Milky Scholars",
                        profiles: {},
                        snapshots: [],
                        auraAssignments: {
                            1: { auraHrid: "/abilities/speed_aura", updatedAt: Date.now() },
                            2: { auraHrid: "/abilities/guardian_aura", updatedAt: Date.now() },
                            3: { auraHrid: "/abilities/speed_aura", updatedAt: Date.now() },
                            4: { auraHrid: "/abilities/mystic_aura", updatedAt: Date.now() },
                        },
                    },
                },
            }));
            send({
                type: "init_client_data",
                skillDetailMap: {
                    "/skills/total_level": { name: "Total Level" },
                    "/skills/cooking": { name: "Cooking" },
                    "/skills/mining": { name: "Mining" },
                },
                guildTrialDetailMap: {
                    "/guild_skilling/cooking": { kind: "skilling", skillHrid: "/skills/cooking" },
                    "/guild_skilling/mining": { kind: "skilling", skillHrid: "/skills/mining" },
                    "/guild_combat/badger": { kind: "combat" },
                    "/guild_combat/swarm": { kind: "combat" },
                },
            });
            send({
                type: "init_character_data",
                guild: { id: 44, name: "The Milky Scholars", trialMinLevelsData: "{\"/guild_skilling/cooking\":90,\"/guild_skilling/mining\":90}" },
                guildCharacterMap,
                guildSharableCharacterMap,
                guildWeeklyTrialSet: { skillHrids: ["/guild_skilling/cooking", "/guild_skilling/mining"], combatHrids: ["/guild_combat/badger", "/guild_combat/swarm"] },
                guildTrialSignupLevelMap: {
                    1: { skillingTrialLevel: 104, combatLevel: 154 },
                    2: { skillingTrialLevel: 101, combatLevel: 149 },
                    3: { skillingTrialLevel: 98 },
                },
                character: { id: 1, name: "Ada" },
                characterSkills: skills(1, 1812, 104, 96),
            });
            send({ type: "profile_shared", profile: { sharableCharacter: { id: 2, name: "Babbage" }, characterSkills: skills(2, 1691, 92, 101) } });
            send({ type: "profile_shared", profile: { sharableCharacter: { id: 3, name: "Curie" }, characterSkills: skills(3, 1744, 99, 98) } });
            setTimeout(() => document.getElementById("mwi-guild-monitor-button").click(), 50);
        });
    </script>
</body>
</html>
